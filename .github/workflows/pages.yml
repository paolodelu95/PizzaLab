# Pubblica su GitHub Pages il sito (docs/) e la web app installabile in /app/.
name: Pubblica sito e web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test del modello di calcolo
        run: npx vitest run
      - name: Build della web app
        run: npx tsc -b && npx vite build --base=/PizzaLab/app/ --outDir dist-web
      - uses: actions/configure-pages@v5
      - name: Build del sito (docs/)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Aggiunge la web app in /app/
        run: |
          sudo mkdir -p _site/app
          sudo cp -r dist-web/. _site/app/
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
